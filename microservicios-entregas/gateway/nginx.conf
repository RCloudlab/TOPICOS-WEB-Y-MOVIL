server {
    listen 80;

    # La página del cliente
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Pedidos (crear y consultar por folio)
    location /pedidos {
        proxy_pass http://pedidos:5000;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    # Salud de cada servicio. recomendar NO se expone fuera de /salud.
    location = /salud/pedidos    { proxy_pass http://pedidos:5000/salud; }
    location = /salud/recomendar { proxy_pass http://recomendar:5001/salud; }
}
